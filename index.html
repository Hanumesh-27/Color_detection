<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Detection in Image</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Color Detection in Image</h1>
        <p>Upload an image and click on any point to detect its color</p>
    </header>

    <main class="container">

        <section class="upload-section">
            <label for="imageInput" class="upload-btn">
                📁 Upload Image
            </label>
            <input type="file" id="imageInput" accept="image/*">

            <button id="resetBtn" class="reset-btn">
                Reset
            </button>
        </section>

        <section class="workspace">

            <div class="image-area">
                <h2>Image</h2>

                <div class="canvas-container">
                    <canvas id="canvas"></canvas>

                    <div id="placeholder">
                        <span>🖼️</span>
                        <p>Upload an image to begin</p>
                    </div>
                </div>

                <p class="instruction">
                    Click anywhere on the image to detect the color
                </p>
            </div>

            <div class="result-area">
                <h2>Detected Color</h2>

                <div id="colorPreview" class="color-preview"></div>

                <div class="color-name">
                    <span>Color Name</span>
                    <strong id="colorName">---</strong>
                </div>

                <div class="details">

                    <div class="detail-box">
                        <span>HEX</span>
                        <strong id="hexValue">---</strong>
                    </div>

                    <div class="detail-box">
                        <span>RGB</span>
                        <strong id="rgbValue">---</strong>
                    </div>

                    <div class="detail-box">
                        <span>Position</span>
                        <strong id="position">---</strong>
                    </div>

                </div>

                <button id="copyBtn" class="copy-btn">
                    📋 Copy Color
                </button>

                <p id="copyMessage"></p>
            </div>

        </section>

    </main>

    <footer>
        <p>DLT Mini Project | Color Detection in Image</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
